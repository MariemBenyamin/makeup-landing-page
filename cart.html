<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سلة المشتريات - Glow</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <style>
        body { padding-top: 100px; background-color: var(--bg-light); }
        .cart-img { width: 90px; height: 90px; object-fit: cover; border-radius: 12px; }
        .qty-btn { background: transparent; border: none; padding: 0 10px; color: var(--dark); font-size: 1.1rem; }
        .qty-btn:hover { color: var(--primary); }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg fixed-top glassmorphism scrolled">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="index.html">GLOW<span>.</span></a>
            <div class="d-flex align-items-center gap-4 nav-icons mt-lg-0 justify-content-center">
                <a href="index.html" class="text-dark" title="الرئيسية"><i class="fa-solid fa-house fs-5"></i></a>
                <a href="wishlist.html" class="text-dark position-relative" title="المفضلة">
                    <i class="fa-solid fa-heart fs-5"></i>
                </a>
            </div>
        </div>
    </nav>

    <!-- Cart Section -->
    <div class="container py-5">
        <h2 class="fw-bold mb-5"><i class="fa-solid fa-bag-shopping me-2 text-primary-custom"></i>سلة المشتريات</h2>
        <div class="row g-5">
            <!-- Cart Items -->
            <div class="col-lg-8">
                <div class="glassmorphism p-4 p-md-5 rounded-4 shadow-sm bg-white">
                    
                    <!-- Item 1 -->
                    <div class="d-flex flex-column flex-sm-row align-items-center gap-4 mb-4 pb-4 border-bottom">
                        <img src="https://images.unsplash.com/photo-1631729371254-42c2892f0e6e?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80" alt="Product" class="cart-img shadow-sm">
                        <div class="flex-grow-1 text-center text-sm-start w-100">
                            <h5 class="fw-bold mb-1">كريم أساس لومينوس</h5>
                            <p class="text-muted small mb-2">الدرجة: Light</p>
                            <h5 class="text-primary-custom fw-bold m-0">$45.00</h5>
                        </div>
                        <div class="d-flex align-items-center gap-4 w-100 justify-content-center justify-content-sm-end mt-3 mt-sm-0">
                            <div class="border rounded-pill px-3 py-2 d-flex align-items-center justify-content-between bg-light" style="width: 120px;">
                                <button class="qty-btn" onclick="updateCartQty('qty1', -1)"><i class="fa-solid fa-minus"></i></button>
                                <span class="fw-bold" id="qty1">1</span>
                                <button class="qty-btn" onclick="updateCartQty('qty1', 1)"><i class="fa-solid fa-plus"></i></button>
                            </div>
                            <button class="btn btn-light text-danger rounded-circle p-2 d-flex align-items-center justify-content-center" style="width:40px; height:40px;" title="إزالة" onclick="this.closest('.d-flex.flex-column').style.display='none'"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>

                    <!-- Item 2 -->
                    <div class="d-flex flex-column flex-sm-row align-items-center gap-4 mb-2">
                        <img src="https://images.unsplash.com/photo-1586495777744-4413f21062fa?ixlib=rb-4.0.3&auto=format&fit=crop&w=200&q=80" alt="Product" class="cart-img shadow-sm">
                        <div class="flex-grow-1 text-center text-sm-start w-100">
                            <h5 class="fw-bold mb-1">أحمر شفاه مخملي - روز</h5>
                            <p class="text-muted small mb-2">الكمية المتوفرة: 5</p>
                            <h5 class="text-primary-custom fw-bold m-0">$25.00</h5>
                        </div>
                        <div class="d-flex align-items-center gap-4 w-100 justify-content-center justify-content-sm-end mt-3 mt-sm-0">
                            <div class="border rounded-pill px-3 py-2 d-flex align-items-center justify-content-between bg-light" style="width: 120px;">
                                <button class="qty-btn" onclick="updateCartQty('qty2', -1)"><i class="fa-solid fa-minus"></i></button>
                                <span class="fw-bold" id="qty2">1</span>
                                <button class="qty-btn" onclick="updateCartQty('qty2', 1)"><i class="fa-solid fa-plus"></i></button>
                            </div>
                            <button class="btn btn-light text-danger rounded-circle p-2 d-flex align-items-center justify-content-center" style="width:40px; height:40px;" title="إزالة" onclick="this.closest('.d-flex.flex-column').style.display='none'"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>

                </div>
                <a href="index.html#products" class="btn btn-outline-dark rounded-pill mt-4 px-4 py-2"><i class="fa-solid fa-arrow-right me-2"></i>متابعة التسوق</a>
            </div>

            <!-- Summary -->
            <div class="col-lg-4">
                <div class="glassmorphism p-4 p-md-5 rounded-4 shadow-sm h-100" style="background-color: var(--secondary);">
                    <h4 class="fw-bold mb-4">ملخص السلة</h4>
                    <div class="d-flex justify-content-between mb-3 text-dark">
                        <span>المجموع الفرعي (منتجين)</span>
                        <span class="fw-bold">$70.00</span>
                    </div>
                    
                    <div class="d-flex justify-content-between mb-3 text-success">
                        <span>الخصم</span>
                        <span class="fw-bold">$0.00</span>
                    </div>

                    <p class="text-muted small mb-4"><i class="fa-solid fa-circle-info me-1"></i>سيتم حساب رسوم الشحن في خطوة الدفع</p>

                    <hr class="border-dark opacity-25">
                    
                    <div class="d-flex justify-content-between fw-bold fs-3 text-primary-custom my-4">
                        <span>الإجمالي</span>
                        <span>$70.00</span>
                    </div>

                    <button class="btn btn-primary-custom w-100 py-3 fs-5 rounded-pill fw-bold shadow-sm" onclick="window.location.href='checkout.html'">
                        متابعة للدفع <i class="fa-solid fa-arrow-left ms-2"></i>
                    </button>
                    
                    <div class="d-flex justify-content-center gap-2 mt-4 text-muted small">
                        <i class="fa-solid fa-shield-halved"></i> تسوق آمن بنسبة 100%
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        function updateCartQty(id, change) {
            const qtySpan = document.getElementById(id);
            let currentQty = parseInt(qtySpan.innerText);
            let newQty = currentQty + change;
            if(newQty >= 1 && newQty <= 10) {
                qtySpan.innerText = newQty;
            }
        }
    </script>
</body>
</html>
