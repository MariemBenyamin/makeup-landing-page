<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدفع - Glow</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <style>
        body { padding-top: 100px; background-color: var(--bg-light); }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg fixed-top glassmorphism scrolled">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="index.html">GLOW<span>.</span></a>
            <div class="d-flex align-items-center gap-4 nav-icons mt-lg-0 justify-content-center">
                <a href="index.html" class="text-dark" title="الرئيسية"><i class="fa-solid fa-house fs-5"></i></a>
            </div>
        </div>
    </nav>

    <!-- Checkout Section -->
    <div class="container py-5">
        <h2 class="fw-bold mb-4">إتمام الطلب</h2>
        <div class="row g-5">
            <!-- Form -->
            <div class="col-lg-8">
                <div class="glassmorphism p-4 p-md-5 rounded-4 shadow-sm bg-white">
                    <h4 class="fw-bold mb-4">معلومات الشحن</h4>
                    <form id="checkout-form">
                        <div class="row g-4">
                            <div class="col-sm-6">
                                <label class="form-label text-muted">الاسم الأول</label>
                                <input type="text" id="firstName" class="form-control px-4 py-3 rounded-3" placeholder="أدخل اسمك الأول">
                            </div>
                            <div class="col-sm-6">
                                <label class="form-label text-muted">الاسم الأخير</label>
                                <input type="text" id="lastName" class="form-control px-4 py-3 rounded-3" placeholder="أدخل اسم العائلة">
                            </div>
                            <div class="col-12">
                                <label class="form-label text-muted">العنوان التفصيلي</label>
                                <input type="text" id="address" class="form-control px-4 py-3 rounded-3" placeholder="الشارع، الحي، رقم المبنى">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted">المحافظة</label>
                                <select class="form-select py-3 rounded-3 text-muted" id="governorate">
                                    <option value="" selected disabled>اختر المحافظة...</option>
                                    <option value="Cairo">القاهرة</option>
                                    <option value="Giza">الجيزة</option>
                                    <option value="Alexandria">الإسكندرية</option>
                                    <option value="Dakahlia">الدقهلية</option>
                                    <option value="Red Sea">البحر الأحمر</option>
                                    <option value="Sharqia">الشرقية</option>
                                    <option value="Gharbia">الغربية</option>
                                    <option value="Fayoum">الفيوم</option>
                                    <option value="Minya">المنيا</option>
                                    <option value="Aswan">أسوان</option>
                                    <option value="Luxor">الأقصر</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-muted">رقم الهاتف</label>
                                <input type="tel" id="phone" class="form-control px-4 py-3 rounded-3" placeholder="+20 1X XXXX XXXX">
                            </div>
                        </div>

                        <h4 class="fw-bold mt-5 mb-4">طريقة الدفع</h4>
                        <div class="d-flex flex-column flex-md-row gap-3 mb-4">
                            <div class="form-check border p-4 rounded-4 flex-fill text-center bg-light">
                                <input class="form-check-input float-none mb-3 mx-auto d-block fs-4" type="radio" name="payment" id="credit" value="credit" checked>
                                <label class="form-check-label d-block fw-bold" for="credit">
                                    <i class="fa-regular fa-credit-card fs-1 text-primary-custom mb-3 d-block"></i>بطاقة ائتمان
                                </label>
                            </div>
                            <div class="form-check border p-4 rounded-4 flex-fill text-center bg-light">
                                <input class="form-check-input float-none mb-3 mx-auto d-block fs-4" type="radio" name="payment" id="cash" value="cash">
                                <label class="form-check-label d-block fw-bold" for="cash">
                                    <i class="fa-solid fa-money-bill-wave fs-1 text-success mb-3 d-block"></i>الدفع عند الاستلام
                                </label>
                            </div>
                        </div>

                        <!-- Credit Card Details -->
                        <div class="row g-3 mb-5" id="card-details">
                            <div class="col-12">
                                <label class="form-label text-muted">الاسم على البطاقة</label>
                                <input type="text" id="cardName" class="form-control px-4 py-3 rounded-3" placeholder="الاسم كما هو مطبوع على البطاقة">
                            </div>
                            <div class="col-12">
                                <label class="form-label text-muted">رقم البطاقة</label>
                                <input type="text" id="cardNumber" class="form-control px-4 py-3 rounded-3" placeholder="XXXX XXXX XXXX XXXX">
                            </div>
                            <div class="col-6">
                                <label class="form-label text-muted">تاريخ الانتهاء</label>
                                <input type="text" id="cardExp" class="form-control px-4 py-3 rounded-3" placeholder="MM/YY">
                            </div>
                            <div class="col-6">
                                <label class="form-label text-muted">رمز التحقق (CVV)</label>
                                <input type="text" id="cardCvv" class="form-control px-4 py-3 rounded-3" placeholder="123">
                            </div>
                        </div>

                        <button type="button" id="pay-btn" class="btn btn-success w-100 py-3 fs-5 rounded-pill fw-bold shadow-lg" onclick="processPayment()">
                            <i class="fa-brands fa-whatsapp fs-4 me-2"></i> إتمام الطلب عبر واتساب
                        </button>
                    </form>
                </div>
            </div>

            <!-- Summary -->
            <div class="col-lg-4">
                <div class="glassmorphism p-4 p-md-5 rounded-4 shadow-sm h-100" style="background-color: var(--secondary);">
                    <h4 class="fw-bold mb-4">ملخص الطلب</h4>
                    <div class="d-flex justify-content-between mb-3 align-items-center">
                        <div class="d-flex align-items-center gap-3">
                            <img src="https://images.unsplash.com/photo-1631729371254-42c2892f0e6e?ixlib=rb-4.0.3&auto=format&fit=crop&w=100&q=80" alt="product" class="rounded-3" width="60" height="60" style="object-fit: cover;">
                            <div>
                                <h6 class="mb-0 fw-bold">كريم أساس لومينوس</h6>
                                <small class="text-muted">الكمية: 1</small>
                            </div>
                        </div>
                        <span class="fw-bold">$45.00</span>
                    </div>
                    
                    <div class="d-flex justify-content-between mb-4 align-items-center">
                        <div class="d-flex align-items-center gap-3">
                            <img src="https://images.unsplash.com/photo-1586495777744-4413f21062fa?ixlib=rb-4.0.3&auto=format&fit=crop&w=100&q=80" alt="product" class="rounded-3" width="60" height="60" style="object-fit: cover;">
                            <div>
                                <h6 class="mb-0 fw-bold">أحمر شفاه مخملي</h6>
                                <small class="text-muted">الكمية: 1</small>
                            </div>
                        </div>
                        <span class="fw-bold">$25.00</span>
                    </div>

                    <div class="input-group mb-4">
                        <input type="text" class="form-control px-3 py-2 border-0 shadow-none" placeholder="كود الخصم">
                        <button class="btn btn-dark px-3" type="button">تطبيق</button>
                    </div>

                    <hr class="border-dark opacity-10">
                    
                    <div class="d-flex justify-content-between mb-3 text-muted">
                        <span>المجموع الفرعي</span>
                        <span>$70.00</span>
                    </div>
                    <div class="d-flex justify-content-between mb-3 text-muted">
                        <span>الشحن</span>
                        <span>$5.00</span>
                    </div>
                    
                    <hr class="border-dark opacity-10">
                    
                    <div class="d-flex justify-content-between fw-bold fs-4 text-primary-custom mt-3">
                        <span>الإجمالي</span>
                        <span>$75.00</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="script.js"></script>
</body>
</html>
